<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div>
    <h1>Taschenrechner</h1>
</div>

<!-- NEU: Dieser Wrapper hält den ganzen Rechner zusammen -->
<div class="calculator">
    <div class="output">
        <input id="output" type="text" readonly>
        <button class="gleich">=</button>
        <button class="reset">CE</button>
    </div>
    <div class="zifferblock">
        <button class="zbutton">1</button>
        <button class="zbutton">2</button>
        <button class="zbutton">3</button>
        <button class="zbutton">4</button>
        <button class="zbutton">5</button>
        <button class="zbutton">6</button>
        <button class="zbutton">7</button>
        <button class="zbutton">8</button>
        <button class="zbutton">9</button>
        <button class="zbutton">0</button>
        <button class="zbutton">.</button>
    </div>
    <div class="operatoren">
        <button class="op">+</button>
        <button class="op">-</button>
        <button class="op">*</button>
        <button class="op">/</button>
    </div>
</div>
</body>
<script src="main.js"></script>
</html>
