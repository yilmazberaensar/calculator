<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div>
        <h1>Taschenrechner</h1>
    </div>
    <div>
        <input id="output" type="number" readonly>
        <button class="gleich">=</button>
    </div>
    <div class="zifferblock">
        <button class="zbutton">1</button>
        <button class="zbutton">2</button>
        <button class="zbutton">3</button>
        <button class="zbutton">4</button>
        <button class="zbutton">5</button>
        <button class="zbutton">6</button>
        <button class="zbutton">7</button>
        <button class="zbutton">8</button>
        <button class="zbutton">9</button>
        <button class="zbutton">0</button>
    </div>
    <div class="operatoren">
        <button class="op">+</button>
        <button class="op">-</button>
        <button class="op">*</button>
        <button class="op">/</button>
    </div>

</body>
<script src="main.js"></script>
</html>
